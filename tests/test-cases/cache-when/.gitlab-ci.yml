---
cache:
  paths:
    - $CACHEDIR/**.txt
on_success_without_error:
  cache:
    - when: on_success
      paths:
        - cache
      policy: push
      key: on_success_without_error
  script: mkdir -p cache && touch cache/file1.txt
on_success_with_error:
  cache:
    - when: on_success
      paths:
        - cache
      policy: push
      key: on_success_with_error
  script: |
    mkdir -p cache && touch cache/file1.txt
    exit 1
on_failure_without_error:
  cache:
    - when: on_failure
      paths:
        - cache
      policy: push
      key: on_failure_without_error
  script: mkdir -p cache && touch cache/file1.txt
on_failure_with_error:
  cache:
    - when: on_failure
      paths:
        - cache
      policy: push
      key: on_failure_with_error
  script: |
    mkdir -p cache && touch cache/file1.txt
    exit 1
always_without_error:
  cache:
    - when: always
      paths:
        - cache
      policy: push
      key: always_without_error
  script: mkdir -p cache && touch cache/file1.txt
always_with_error:
  cache:
    - when: always
      paths:
        - cache
      policy: push
      key: always_with_error
  script: |
    mkdir -p cache && touch cache/file1.txt
    exit 1
push_before_pull_push:
  cache:
    - key: push_before_pull_push_push
      policy: push
      paths:
        - cache
    - key: push_before_pull_push_pull_push
      policy: pull-push
      paths:
        - cache
  script: test -f cache/imported.txt
pull_before_pull_push:
  cache:
    - key: pull_before_pull_push_pull
      policy: pull
      paths:
        - cache
    - key: pull_before_pull_push_pull_push
      policy: pull-push
      paths:
        - cache
  script: mkdir -p cache && touch cache/file1.txt
