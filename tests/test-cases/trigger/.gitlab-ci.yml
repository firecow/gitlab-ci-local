---
pipe-gen-job:
  image: alpine
  stage: build
  variables:
    VAR_FROM_ANOTHER_MOTHER: "echo me i'm generated"
  artifacts:
    paths: [.gitlab-ci-child.yml]
  script:
    - apk add --no-cache envsubst
    - cat .gitlab-ci.tmpl | envsubst > .gitlab-ci-child.yml

include-trigger:
  stage: test
  trigger:
    include:
      - artifact: .gitlab-ci-child.yml
        job: pipe-gen-job

remote-trigger:
  trigger:
    project: mytarget/project
    branch: master

variable-expand-trigger:
  stage: test
  variables:
    DERIVED_VALUE: "${BASE_VALUE}-world"
  trigger:
    include:
      - local: .gitlab-ci-variable-expand-child.yml
