---
test-job:
  script:
    - Write-Output "hello from powershell"
    - if ($env:MY_VAR -ne "from-env") { throw "MY_VAR not passed to PowerShell process" }
    - Write-Output "MY_VAR=$env:MY_VAR"

fail-job:
  script:
    - throw "expected failure"
  allow_failure: true

native-fail-job:
  script:
    - cmd /c exit 3
    - Write-Output "not printed"
  allow_failure:
    exit_codes: 3
