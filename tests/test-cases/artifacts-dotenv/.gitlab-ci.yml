---
build-image-ref:
  stage: build
  needs: []
  script:
    - echo "BUILD_IMAGE_REF=alpine" > build.env
    - echo "SERVICE_IMAGE_REF=docker.io/library/redis" >> build.env
    - echo "SERVICE_IMAGE_ALIAS=redis" >> build.env
  artifacts:
    reports: { dotenv: build.env }

use-image-ref:
  stage: deploy
  needs: [build-image-ref]
  image: ${BUILD_IMAGE_REF}
  script:
    - if [ "$BUILD_IMAGE_REF" = "" ]; then exit 1; else cat /etc/os-release; fi

use-service-ref:
  stage: deploy
  needs: [build-image-ref]
  services:
    - name: $SERVICE_IMAGE_REF
      alias: $SERVICE_IMAGE_ALIAS
  image: docker.io/massenz/dnsutils:2.4.0
  script:
    - host $SERVICE_IMAGE_ALIAS

# reports.dotenv is exported regardless of the producer's status, so a consumer
# that still runs after a failed/warned producer gets its variables.
build-failure-ref:
  stage: build
  needs: []
  script:
    - echo "FAILURE_REF=failure-value" > failure.env
    - exit 1
  artifacts:
    reports: {dotenv: failure.env}

build-warning-ref:
  stage: build
  needs: []
  allow_failure: true
  script:
    - echo "WARNING_REF=warning-value" > warning.env
    - exit 1
  artifacts:
    reports: {dotenv: warning.env}

use-non-success-ref:
  stage: deploy
  when: always
  needs: [build-failure-ref, build-warning-ref]
  script:
    - echo "FAILURE_REF is [$FAILURE_REF]"
    - echo "WARNING_REF is [$WARNING_REF]"
